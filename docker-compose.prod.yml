# Production Docker Compose - MVP backend stack (Vercel frontend + server backend)
# Usage:
#   cp .env.prod.example .env.prod
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Notes:
# - Frontend is deployed on Vercel (not included in this compose file)
# - Default stack: postgres + backend + nginx
# - LanceDB runs locally inside the backend container (LANCEDB_MODE=local)
# - Graph features use PostgreSQL (Neo4j removed)

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: law-platform-db-prod
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lawdb}
    command: postgres -c shared_preload_libraries=pg_textsearch
    volumes:
      # PostgreSQL data (persistent)
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawuser} -d ${POSTGRES_DB:-lawdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - law-network

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.prod
    container_name: law-platform-backend
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lawuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lawdb}
      ENVIRONMENT: production
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set for production}

      # AI / external APIs
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      KAKAO_MAP_API_KEY: ${KAKAO_MAP_API_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}

      # API authentication (X-API-Key) — 프로덕션 필수
      API_KEY: ${API_KEY:?API_KEY must be set for production}

      # Rate limit storage (MVP single instance default)
      # Use redis://... for multi-instance deployment
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}

      # Vector DB options (LanceDB local)
      VECTOR_DB: ${VECTOR_DB:-lancedb}
      LANCEDB_MODE: local
      LANCEDB_URI: ${LANCEDB_URI:-/app/lancedb_data}
      LANCEDB_TABLE_NAME: ${LANCEDB_TABLE_NAME:-legal_chunks}
      USE_LEGAL_TERM_DICT: ${USE_LEGAL_TERM_DICT:-false}
      CHROMA_PERSIST_DIR: /app/data/chroma

      # Embedding / Reranker
      USE_LOCAL_EMBEDDING: ${USE_LOCAL_EMBEDDING:-true}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-nlpai-lab/KURE-v1}
      USE_ONNX_EMBEDDING: ${USE_ONNX_EMBEDDING:-false}
      USE_ONNX_RERANKER: ${USE_ONNX_RERANKER:-false}

      # MeCab userdic
      MECAB_USERDIC_PATH: ${MECAB_USERDIC_PATH:-data/mecab_userdic/legal_terms.dic}

      # AI model selection
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3-flash-preview}

      # ML 모델 캐시 디렉토리 (read-only /app/data 외부)
      MODEL_CACHE_DIR: ${MODEL_CACHE_DIR:-/app/models}

      # Runtime tuning
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-120}

      # Feature flags
      USE_DB_LAWYERS: ${USE_DB_LAWYERS:-false}
      ENABLED_MODULES: ${ENABLED_MODULES:-[]}
    volumes:
      - chroma_data:/app/data/chroma
      # App data (readonly)
      - ./data:/app/data:ro
      # LanceDB local mode data (persistent)
      - lancedb_data:/app/lancedb_data
      # ML models (writable - 컨테이너 내부에서 다운로드 가능, /app/data:ro 외부)
      - ./backend/data/models:/app/models
      # MeCab userdic (readonly, host에서 사전 빌드)
      - ./backend/data/mecab_userdic:/app/data/mecab_userdic:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - law-network

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: law-platform-nginx
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint-wrapper.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.example.com}
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/api.conf.template:/etc/nginx/templates/api.conf.template:ro
      - ./docker/nginx/docker-entrypoint-wrapper.sh:/usr/local/bin/docker-entrypoint-wrapper.sh:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - law-network

  # Let's Encrypt 인증서 자동 발급/갱신
  # 초기 설정: scripts/deploy/init-letsencrypt.sh 실행
  # 갱신 후 nginx 적용: crontab -e → 0 */12 * * * docker exec law-platform-nginx nginx -s reload
  certbot:
    image: certbot/certbot
    container_name: law-platform-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - law-network

networks:
  law-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  lancedb_data:
  certbot_www:
  certbot_certs:
