# Development Docker Compose - PostgreSQL + LanceDB
# Usage: docker-compose up -d postgres
#        docker-compose up -d lancedb  (벡터 검색 마이크로서비스)
# 환경변수: 루트 .env 파일에서 로드 (cp .env.example .env 후 편집)

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: law-platform-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lawuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lawdb}
    command: postgres -c shared_preload_libraries=pg_textsearch
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lawuser} -d ${POSTGRES_DB:-lawdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  lancedb:
    build:
      context: ./services/lancedb
      dockerfile: Dockerfile
    container_name: lancedb-service
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - lancedb_data:/app/lancedb_data
      - ./backend/data/mecab_userdic:/app/mecab_userdic:ro
    environment:
      - LANCEDB_URI=/app/lancedb_data
      - LANCEDB_TABLE_NAME=${LANCEDB_TABLE_NAME:-legal_chunks}
      - USE_LEGAL_TERM_DICT=${USE_LEGAL_TERM_DICT:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  lancedb_data:
    external: true
    name: law-3-team_lancedb_data
