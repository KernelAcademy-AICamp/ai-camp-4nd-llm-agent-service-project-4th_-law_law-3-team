name: Deploy to EC2

on:
  push:
    branches: [deploy/aws-arm]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  ENV_FILE: .env.prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_DIR || '/opt/law-platform' }}

            # 최신 코드 가져오기
            git fetch origin
            git checkout deploy/aws-arm
            git pull origin deploy/aws-arm

            # 빌드 및 재시작
            docker compose --env-file ${{ env.ENV_FILE }} -f ${{ env.COMPOSE_FILE }} build
            docker compose --env-file ${{ env.ENV_FILE }} -f ${{ env.COMPOSE_FILE }} up -d

            # DB 마이그레이션
            docker compose --env-file ${{ env.ENV_FILE }} -f ${{ env.COMPOSE_FILE }} exec -T backend python -m alembic upgrade head

            # 헬스 체크 (최대 120초 대기 — ML 모델 로드 고려)
            for i in $(seq 1 12); do
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for health check... ($i/12)"
              sleep 10
            done
            echo "WARNING: Health check did not pass within 120s"
            docker compose --env-file ${{ env.ENV_FILE }} -f ${{ env.COMPOSE_FILE }} logs --tail=50 backend
            exit 1
