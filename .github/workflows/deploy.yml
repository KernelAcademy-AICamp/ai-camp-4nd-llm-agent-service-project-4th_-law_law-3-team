name: Deploy to EC2

on:
  push:
    branches: [deploy/aws-arm]
  workflow_dispatch:
    inputs:
      sync_data:
        description: 'S3 데이터 동기화 (data/, MeCab)'
        type: boolean
        default: false
      load_lancedb:
        description: 'LanceDB 벡터 → Docker volume 복사'
        type: boolean
        default: false
      clean_models:
        description: '불완전 모델 캐시 삭제 (재다운로드 유도)'
        type: boolean
        default: false
      init_ssl:
        description: 'SSL 인증서 초기 발급'
        type: boolean
        default: false
      skip_ci:
        description: 'CI 검사 건너뛰기 (데이터만 갱신 시)'
        type: boolean
        default: false

env:
  COMPOSE_FILE: docker-compose.prod.yml
  ENV_FILE: .env.prod
  AWS_REGION: ap-northeast-2
  SG_ID: sg-03de4a63f3a0ddee6

jobs:
  ci:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_ci) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Backend lint
        run: cd backend && uvx ruff check app/
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build check
        run: cd frontend && npm ci && npm run build

  deploy:
    needs: ci
    if: ${{ always() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s ifconfig.me)/32" >> $GITHUB_OUTPUT

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.PROJECT_DIR || '/opt/law-platform' }}
            git fetch origin
            git checkout deploy/aws-arm
            git pull origin deploy/aws-arm

            # deploy.sh 플래그 조립
            DEPLOY_FLAGS="--skip-pull"
            if [ "${{ inputs.sync_data }}" = "true" ]; then
              DEPLOY_FLAGS="$DEPLOY_FLAGS --sync-data"
            fi
            if [ "${{ inputs.load_lancedb }}" = "true" ]; then
              DEPLOY_FLAGS="$DEPLOY_FLAGS --load-lancedb"
            fi
            bash scripts/deploy/deploy.sh $DEPLOY_FLAGS

            # post-deploy 작업 (workflow_dispatch에서만)
            if [ "${{ inputs.clean_models }}" = "true" ]; then
              bash scripts/deploy/post-deploy.sh --skip-s3 --skip-lancedb --clean-models
            fi
            if [ "${{ inputs.init_ssl }}" = "true" ]; then
              bash scripts/deploy/init-letsencrypt.sh
            fi

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }} 2>/dev/null || true
