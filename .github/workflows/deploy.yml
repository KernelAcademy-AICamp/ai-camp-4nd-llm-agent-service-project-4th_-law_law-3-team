name: Deploy to EC2

on:
  push:
    branches: [deploy/aws-arm]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  ENV_FILE: .env.prod
  AWS_REGION: ap-northeast-2
  SG_ID: sg-03de4a63f3a0ddee6

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Backend lint
        run: cd backend && uvx ruff check app/
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Frontend build check
        run: cd frontend && npm ci && npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get runner IP
        id: ip
        run: echo "ip=$(curl -s ifconfig.me)/32" >> $GITHUB_OUTPUT

      - name: Open SSH for runner
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.PROJECT_DIR || '/opt/law-platform' }}
            git fetch origin
            git checkout deploy/aws-arm
            git pull origin deploy/aws-arm
            bash scripts/deploy/deploy.sh --skip-pull

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.SG_ID }} \
            --protocol tcp --port 22 \
            --cidr ${{ steps.ip.outputs.ip }} 2>/dev/null || true
