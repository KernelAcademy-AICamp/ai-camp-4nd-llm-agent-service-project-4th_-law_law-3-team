[project]
name = "law-platform-backend"
version = "0.1.0"
description = "법률 서비스 플랫폼 API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "openai>=1.12.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "chromadb>=0.4.22",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.5.0",
    "greenlet>=3.3.0",
    "sentence-transformers>=5.2.0",
    "google-generativeai>=0.8.0",
    "google-genai>=0.5.0",
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "sse-starlette>=1.6.0",
    "aiofiles>=23.0.0",
    "lancedb>=0.15.0",
    "pandas>=2.0.0",
    "langsmith>=0.2.0",
    "gradio>=4.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0",
    "neo4j>=5.15.0",
    "langchain-neo4j>=0.1.0",
    "typer>=0.9.0",
    "mecab-python3>=1.0.12",
    "onnxruntime>=1.17.0",
    "reportlab>=4.4.9",
    "jinja2>=3.1.6",
    "python-hwpx>=1.9",
    "python-docx>=1.2.0",
    "tqdm>=4.66.0",
    "ijson>=3.2.0",
    "slowapi>=0.1.9",
    "tavily-python>=0.7.21",
    "llmlingua>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "mypy>=1.8.0",
    "ijson>=3.2.0",
    "plotly>=5.18.0",
    "nbformat>=5.9.0",
    "tqdm>=4.66.0",
    "kaleido>=0.2.1",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.10.8",
]

onnx-optimization = [
    "optimum[onnxruntime]>=1.17.0",
    "scipy>=1.11.0",
    "onnx-simplifier==0.4.36",
    "onnxsim==0.4.36",
    "onnxruntime-extensions>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"  # 전체 테스트 세션 동안 같은 이벤트 루프 공유
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_lancedb: marks tests that require LanceDB data",
    "requires_postgres: marks tests that require PostgreSQL data",
]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.14",
    "mypy>=1.8.0",
    "ijson>=3.2.0",
    "plotly>=5.18.0",
    "nbformat>=5.9.0",
    "tqdm>=4.66.0",
    "kaleido>=0.2.1",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.10.8",
]

onnx-optimization = [
    "optimum[onnxruntime]>=1.17.0",
    "scipy>=1.11.0",
    "onnx-simplifier==0.4.36",
    "onnxsim==0.4.36",
    "onnxruntime-extensions>=0.10.0",
]
